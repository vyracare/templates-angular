name: PR TO DEVELOP

on:
  push:
    branches:
      - 'feat/*'
      - 'fix/*'
      - 'feature/*'

jobs:
  ci-angular:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Configure package registry
        shell: bash
        run: |
          set -euo pipefail
          endpoint="$(aws codeartifact get-repository-endpoint --domain vyracare-design-system --domain-owner 510253726006 --repository vyracare-design-system --format npm --region us-east-1 --query repositoryEndpoint --output text)"
          token="$(aws codeartifact get-authorization-token --domain vyracare-design-system --domain-owner 510253726006 --region us-east-1 --query authorizationToken --output text)"
          echo "::add-mask::$token"
          host="${endpoint#https://}"
          printf 'registry=https://registry.npmjs.org/\n@vyracare:registry=%s\n//%s:_authToken=%s\n' "$endpoint" "$host" "$token" > .npmrc
      - name: Generate validation project
        run: bash rename-angular-project.sh vyracare-template-validation
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build generated project
        run: npm run build -- --configuration production
      - name: Test generated project
        run: npm test -- --runInBand

  open-pr-develop:
    runs-on: ubuntu-latest
    needs: ci-angular
    if: startsWith(github.ref, 'refs/heads/feat/') || startsWith(github.ref, 'refs/heads/fix/') || startsWith(github.ref, 'refs/heads/feature/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Open Pull Request to develop
        uses: repo-sync/pull-request@v2
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          source_branch: ${{ github.ref_name }}
          destination_branch: develop
          pr_title: "PR automatic ${{ github.ref_name }} into develop"
          pr_body: |
            PR automática criada pelo pipeline.
            Branch de origem: `${{ github.ref_name }}`
